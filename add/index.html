<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add on Yonder</title>
<style>
  :root { --bg: #fbf1ea; --text: #1f1a17; --muted: #6b625c; --accent: #a8341f; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1120; --text: #f1ece6; --muted: #a39a92; --accent: #ef8466; --card: #191c2b; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
  p { color: var(--muted); }
  .card { background: var(--card); border-radius: 18px; padding: 18px; margin-top: 20px; }
  button { width: 100%; border: 0; border-radius: 12px; padding: 14px; font: 600 17px -apple-system, sans-serif; background: var(--accent); color: #fff; }
  a { color: var(--accent); }
</style>
</head>
<body><main>
<h1>Someone wants to watch together on Yonder</h1>
<p>If you have Yonder on this iPhone, this link should have opened it. If it didn't:</p>
<div class="card">
  <p><strong>1.</strong> Tap the button to copy this profile.<br><strong>2.</strong> Open Yonder → Together → <strong>Paste a code</strong>.</p>
  <button id="copy">Copy profile</button>
  <p id="msg" style="margin:10px 0 0"></p>
</div>
<p style="margin-top:24px">Don't have Yonder yet? It's in testing. Ask the person who sent this for an invite.</p>
<script>
  // the profile rides after "#", which never reaches any server
  var code = decodeURIComponent((location.hash || "").slice(1));
  var btn = document.getElementById("copy"), msg = document.getElementById("msg");
  if (!code) { btn.disabled = true; msg.textContent = "This link has no profile in it."; }
  btn.onclick = function () {
    navigator.clipboard.writeText(code).then(function () { msg.textContent = "Copied. Now open Yonder."; },
      function () { msg.textContent = "Couldn't copy. Press and hold to copy the link instead."; });
  };
</script>
</main></body>
</html>
