<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add on Yonder</title>
<style>
  :root { --bg: #fbf1ea; --text: #1f1a17; --muted: #6b625c; --accent: #a8341f; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1120; --text: #f1ece6; --muted: #a39a92; --accent: #ef8466; --card: #191c2b; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
  p { color: var(--muted); }
  .card { background: var(--card); border-radius: 18px; padding: 18px; margin-top: 20px; }
  .btn { display: block; box-sizing: border-box; width: 100%; text-align: center; text-decoration: none; border-radius: 12px; padding: 14px; font: 600 17px -apple-system, sans-serif; background: var(--accent); color: #fff; }
  a { color: var(--accent); }
</style>
</head>
<body><main>
<h1>Someone wants to watch together on Yonder</h1>
<p>If you have Yonder on this iPhone, this link should have opened it. If it didn't, tap the button below.</p>
<div class="card">
  <a id="open" class="btn" href="#">Open in Yonder</a>
  <p id="msg" style="margin:10px 0 0"></p>
</div>
<p style="margin-top:24px">Don't have Yonder yet? It's in testing. Ask the person who sent this for an invite, then tap this link again.</p>
<script>
  // the profile rides after "#", which never reaches any server;
  // the button hands it to the app's own yonder:// link (no copying or pasting)
  var code = (location.hash || "").slice(1);
  var open = document.getElementById("open"), msg = document.getElementById("msg");
  if (!code) { open.removeAttribute("href"); open.style.opacity = 0.4; msg.textContent = "This link has no profile in it."; }
  else { open.href = "yonder://add#" + code; }
</script>
</main></body>
</html>
